<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07121f"><title>A1SC TrainLab · Administration</title><style>:root{font-family:system-ui,Arial;color:#edf5ff;background:#07121f}*{box-sizing:border-box}body{max-width:760px;margin:auto;padding:24px 18px 60px}a{color:#80c9ff}header{display:flex;justify-content:space-between;align-items:center}h1{margin:28px 0 4px}p{color:#a8bfd0}input,select,button{font:inherit;padding:11px;border-radius:9px}input,select{color:white;background:#10273b;border:1px solid #46607b}input{width:100%;margin:6px 0 12px}button{background:#196baf;color:white;border:1px solid #348ed3;cursor:pointer}button:disabled{opacity:.5}.panel{margin-top:20px;background:#102033;border:1px solid #2b4964;padding:18px;border-radius:14px}label{display:block;font-size:14px}#status{white-space:pre-wrap}table{width:100%;border-collapse:collapse;overflow-wrap:anywhere}th,td{padding:10px 6px;border-bottom:1px solid #36516a;text-align:left;font-size:14px}#dashboard[hidden],#login[hidden]{display:none}small{color:#a8bfd0}</style></head><body><header><a href="./" id="back">← TrainLab</a><select id="lang"><option value="en">ENG</option><option value="es">ESP</option></select></header><h1 id="title">Administration</h1><p id="intro">Owner dashboard preview · Read-only. No account decisions can be made here.</p><section class="panel" id="login"><label id="emailLabel" for="email">Email</label><input id="email" type="email" autocomplete="email"><label id="passwordLabel" for="password">Password</label><input id="password" type="password" autocomplete="current-password"><button id="signin">Sign in</button></section><section class="panel"><div id="status" role="status" aria-live="polite">Checking sign-in…</div><button id="signout" hidden>Sign out</button></section><section class="panel" id="dashboard" hidden><h2 id="requestsTitle">Account requests</h2><p id="readonly">Read-only preview. Approvals and audit logging are not active.</p><button id="refresh">Refresh</button><div style="overflow-x:auto"><table><thead><tr><th id="colEmail">Email</th><th id="colStatus">Status</th><th id="colCreated">Created</th></tr></thead><tbody id="requests"></tbody></table></div><small id="count"></small></section><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,collection,getDocs} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const config={apiKey:'AIzaSyDaRUTuiualKkTg9wg0cULAehC4LvCTATs',authDomain:'a1sc-trainlab.firebaseapp.com',projectId:'a1sc-trainlab',storageBucket:'a1sc-trainlab.firebasestorage.app',messagingSenderId:'996865570767',appId:'1:996865570767:web:587e9540bd1cd1d7c704ba'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const strings={en:{title:'Administration',intro:'Owner dashboard preview · Read-only. No account decisions can be made here.',emailLabel:'Email',passwordLabel:'Password',signin:'Sign in',signout:'Sign out',requestsTitle:'Account requests',readonly:'Read-only preview. Approvals and audit logging are not active.',refresh:'Refresh',colEmail:'Email',colStatus:'Status',colCreated:'Created',checking:'Checking sign-in…',signedOut:'Sign in with your verified Owner account.',verify:'Verify your email before continuing.',denied:'Owner access required. No records were displayed.',loading:'Loading account requests…',ready:'Owner verified. Account requests loaded.',empty:'No account requests found.',failed:'Unable to load: ',count:'Requests: '},es:{title:'Administración',intro:'Vista previa del propietario · Solo lectura. No se pueden aprobar cuentas aquí.',emailLabel:'Correo electrónico',passwordLabel:'Contraseña',signin:'Iniciar sesión',signout:'Cerrar sesión',requestsTitle:'Solicitudes de acceso',readonly:'Vista de solo lectura. Las aprobaciones y el historial de auditoría aún no están activos.',refresh:'Actualizar',colEmail:'Correo',colStatus:'Estado',colCreated:'Creada',checking:'Comprobando sesión…',signedOut:'Inicia sesión con tu cuenta verificada de propietario.',verify:'Verifica tu correo antes de continuar.',denied:'Se requiere acceso de propietario. No se mostraron registros.',loading:'Cargando solicitudes…',ready:'Propietario verificado. Solicitudes cargadas.',empty:'No hay solicitudes.',failed:'No se pudo cargar: ',count:'Solicitudes: '}};
let lang=new URLSearchParams(location.search).get('lang')==='es'?'es':'en',generation=0;$('lang').value=lang;const t=k=>strings[lang][k];function translate(){document.documentElement.lang=lang;for(const k of ['title','intro','emailLabel','passwordLabel','signin','signout','requestsTitle','readonly','refresh','colEmail','colStatus','colCreated'])$(k).textContent=t(k)}$('lang').onchange=()=>{lang=$('lang').value;translate();render()};let rows=[],isOwner=false;function render(){if(!isOwner)return;$('requests').replaceChildren();for(const r of rows){const tr=document.createElement('tr');for(const value of [r.email,r.status,r.created]){const td=document.createElement('td');td.textContent=value;tr.append(td)}$('requests').append(tr)}$('count').textContent=rows.length?t('count')+rows.length:t('empty')}
async function load(){const id=++generation;const user=auth.currentUser;isOwner=false;rows=[];$('dashboard').hidden=true;$('login').hidden=!!user;$('signout').hidden=!user;if(!user){$('status').textContent=t('signedOut');return}if(!user.emailVerified){$('status').textContent=t('verify');return}$('status').textContent=t('loading');try{const role=await getDoc(doc(db,'appRoles',user.uid));if(id!==generation)return;if(!role.exists()||role.data().role!=='owner'){$('status').textContent=t('denied');return}const snapshot=await getDocs(collection(db,'accountRequests'));if(id!==generation)return;rows=snapshot.docs.map(d=>({email:String(d.data().email||''),status:String(d.data().status||''),created:d.data().createdAt?.toDate?.()?.toLocaleString()||'—'}));rows.sort((a,b)=>a.email.localeCompare(b.email));isOwner=true;$('dashboard').hidden=false;render();$('status').textContent=t('ready')}catch(e){if(id===generation)$('status').textContent=t('failed')+e.message}}
$('signin').onclick=async()=>{try{$('status').textContent=t('checking');await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await load()}catch(e){$('status').textContent=t('failed')+e.message}};$('signout').onclick=()=>signOut(auth);$('refresh').onclick=load;onAuthStateChanged(auth,load);translate();
</script></body></html>
