<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07121f"><title>A1SC TrainLab · Account</title>
<style>:root{font-family:system-ui,Arial;color:#edf5ff;background:#07121f}*{box-sizing:border-box}body{margin:0 auto;max-width:560px;padding:25px 18px 60px}a{color:#80c9ff}header{display:flex;align-items:center;justify-content:space-between;gap:12px}select,input,button{font:inherit;border-radius:10px;padding:12px}select,input{background:#10273b;border:1px solid #46607b;color:#fff}input{width:100%;margin:5px 0 15px}label{display:block;font-size:14px}button{background:#196baf;color:#fff;border:1px solid #348ed3;cursor:pointer;font-weight:700}button:disabled{opacity:.55}h1{margin:24px 0 4px}.muted{color:#a8bfd0}.panel{background:#102033;border:1px solid #2b4964;padding:20px;border-radius:16px;margin-top:20px}.buttons{display:flex;gap:8px;flex-wrap:wrap}#message{white-space:pre-line;line-height:1.5}#message:not(:empty){padding:12px;border:1px solid #426887;border-radius:10px;margin-top:16px}small{line-height:1.5;display:block;margin-top:16px}</style></head>
<body><header><a href="./" id="back">← TrainLab</a><select id="lang" aria-label="Language"><option value="en">ENG</option><option value="es">ESP</option></select></header>
<h1 id="title">TrainLab Account</h1><p class="muted" id="intro">Registration preview. Current testers can keep using TrainLab without signing in.</p>
<div class="panel"><label id="emailLabel" for="email">Email</label><input id="email" type="email" autocomplete="email" required><label id="passwordLabel" for="password">Password (at least 6 characters)</label><input id="password" type="password" autocomplete="current-password" minlength="6" required>
<div class="buttons"><button id="register">Create account</button><button id="signin">Sign in</button><button id="request" hidden>Request approval</button><button id="signout" hidden>Sign out</button></div><div id="message" role="status" aria-live="polite"></div><small class="muted" id="notice">Verify your email before requesting access. Creating an account does not grant access. Workout data remains on your device.</small></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendEmailVerification,signOut,onAuthStateChanged,reload} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDaRUTuiualKkTg9wg0cULAehC4LvCTATs',authDomain:'a1sc-trainlab.firebaseapp.com',projectId:'a1sc-trainlab',storageBucket:'a1sc-trainlab.firebasestorage.app',messagingSenderId:'996865570767',appId:'1:996865570767:web:587e9540bd1cd1d7c704ba',measurementId:'G-V5EZCV3TJ8'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),copy={en:{title:'TrainLab Account',intro:'Registration preview. Current testers can keep using TrainLab without signing in.',emailLabel:'Email',passwordLabel:'Password (at least 6 characters)',register:'Create account',signin:'Sign in',request:'Request approval',signout:'Sign out',notice:'Verify your email before requesting access. Creating an account does not grant access. Workout data remains on your device.',sent:'Account created. Check your inbox for the verification email, then sign in and request approval.',signed:'Signed in as ',verify:'Your email is not verified. Open the verification email, then return and sign in again.',ready:'Email verified. You can request approval.',pending:'Your request is pending approval.',status:'Your account status: ',done:'Approval request submitted. Status: pending.',out:'Signed out.',error:'Firebase error: ',working:'Please wait…'},es:{title:'Cuenta de TrainLab',intro:'Vista previa del registro. Los participantes actuales pueden seguir usando TrainLab sin iniciar sesión.',emailLabel:'Correo electrónico',passwordLabel:'Contraseña (mínimo 6 caracteres)',register:'Crear cuenta',signin:'Iniciar sesión',request:'Solicitar aprobación',signout:'Cerrar sesión',notice:'Verifica tu correo antes de solicitar acceso. Crear una cuenta no concede acceso. Los entrenamientos permanecen en tu dispositivo.',sent:'Cuenta creada. Revisa tu correo de verificación, después inicia sesión y solicita aprobación.',signed:'Sesión iniciada: ',verify:'Tu correo no está verificado. Abre el mensaje de verificación y vuelve a iniciar sesión.',ready:'Correo verificado. Puedes solicitar aprobación.',pending:'Tu solicitud está pendiente de aprobación.',status:'Estado de tu cuenta: ',done:'Solicitud enviada. Estado: pendiente.',out:'Sesión cerrada.',error:'Error de Firebase: ',working:'Espera…'}};
let language=new URLSearchParams(location.search).get('lang')==='es'?'es':'en';$('lang').value=language;function t(k){return copy[language][k]}function message(s){$('message').textContent=s}function translate(){document.documentElement.lang=language;for(const k of ['title','intro','emailLabel','passwordLabel','register','signin','request','signout','notice'])$(k).textContent=t(k);refresh()}$('lang').onchange=()=>{language=$('lang').value;translate()};let user=null;function busy(b){for(const id of ['register','signin','request','signout'])$(id).disabled=b;if(b)message(t('working'))}async function refresh(){user=auth.currentUser;$('register').hidden=!!user;$('signin').hidden=!!user;$('signout').hidden=!user;$('request').hidden=true;if(!user)return;await reload(user);user=auth.currentUser;if(!user)return;if(!user.emailVerified){message(t('signed')+user.email+'\n'+t('verify'));return}const snap=await getDoc(doc(db,'accountRequests',user.uid));if(snap.exists()){message(t('signed')+user.email+'\n'+t('status')+snap.data().status)}else{message(t('signed')+user.email+'\n'+t('ready'));$('request').hidden=false}}
$('register').onclick=async()=>{busy(true);try{const credential=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await sendEmailVerification(credential.user);await signOut(auth);message(t('sent'))}catch(e){message(t('error')+e.message)}finally{busy(false)}};
$('signin').onclick=async()=>{busy(true);try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await refresh()}catch(e){message(t('error')+e.message)}finally{busy(false)}};
$('request').onclick=async()=>{busy(true);try{const u=auth.currentUser;await reload(u);if(!u.emailVerified)throw Error(t('verify'));const ref=doc(db,'accountRequests',u.uid);if(!(await getDoc(ref)).exists())await setDoc(ref,{email:u.email,status:'pending',createdAt:serverTimestamp()});await refresh();message(t('done'))}catch(e){message(t('error')+e.message)}finally{busy(false)}};
$('signout').onclick=async()=>{await signOut(auth);message(t('out'))};onAuthStateChanged(auth,()=>refresh().catch(e=>message(t('error')+e.message)));translate();
</script></body></html>
